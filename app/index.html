<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pretty Studio</title>
<link rel="icon" href="pretty-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head><body>
<div class="shell">
  <aside class="side" id="side">
    <div class="brand"><img src="pretty-logo.png" alt="Pretty"><div class="tag">Studio</div></div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div class="foot-nav" id="footNav"></div>
      <button class="ver" id="ver" title="What's new"></button>
      <div class="copy" id="copy"></div>
    </div>
  </aside>
  <main class="main">
    <button class="menu-btn" id="menuBtn" aria-label="Menu">☰</button>
    <div id="page"></div>
  </main>
</div>
<div id="toast" class="toast" hidden></div>
<div id="modal" class="modal" hidden><div class="modal-card" id="modalCard"></div></div>
<script type="module" src="app.js"></script>
</body></html>
